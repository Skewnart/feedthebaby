[package]
name = "topcoat-test"
version = "0.1.0"
edition = "2024"

[build-dependencies]
# We cannot use `workspace = true` with `default-features = false`.
topcoat = { version = "0.11.0", default-features = false, features = ["tailwind", "icon-iconify"] }

[dependencies]
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros"] }
topcoat = { version = "0.11.0", features = ["font-fontsource", "tailwind", "ui", "icon-iconify"]}
